<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      min-height: 300px;
      background: #0a0a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 15px;
      background: linear-gradient(to right, #4ade80, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .message {
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      word-break: break-all;
      white-space: pre-wrap;
    }
    .warning {
      padding: 10px;
      background: rgba(234,179,8,0.05);
      border: 1px solid rgba(234,179,8,0.15);
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 11px;
      color: #eab308;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn-reject {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
      color: #ef4444;
    }
    .btn-confirm {
      background: linear-gradient(to right, #4ade80, #10b981);
      color: #000;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <h1>SweepGuard</h1>
  </div>

  <div id="title" style="font-size: 14px; font-weight: 600; margin-bottom: 12px;"></div>
  <div id="message" class="message"></div>
  <div class="warning">⚠️ Only confirm if you trust this action.</div>

  <div class="buttons">
    <button id="rejectBtn" class="btn btn-reject">✕ Reject</button>
    <button id="confirmBtn" class="btn btn-confirm">✓ Confirm</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const title = params.get('title') || 'Confirm Action'
    const message = params.get('message') || ''
    const confirmId = params.get('id') || ''

    document.getElementById('title').textContent = title
    document.getElementById('message').textContent = message

    document.getElementById('confirmBtn').addEventListener('click', () => {
      chrome.runtime.sendMessage({
        type: 'CONFIRM_RESPONSE',
        confirmId,
        confirmed: true,
      }, () => window.close())
    })

    document.getElementById('rejectBtn').addEventListener('click', () => {
      chrome.runtime.sendMessage({
        type: 'CONFIRM_RESPONSE',
        confirmId,
        confirmed: false,
      }, () => window.close())
    })
  </script>
</body>
</html>
