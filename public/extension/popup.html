<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SweepGuard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 400px;
      background: #030305;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header .logo { font-size: 28px; }
    .header h1 {
      font-size: 18px;
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .status-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .status-row + .status-row { border-top: 1px solid rgba(255,255,255,0.04); }
    .status-label { color: rgba(255,255,255,0.4); font-size: 13px; }
    .status-value { font-weight: 600; font-size: 14px; }
    .status-value.safe { color: #22c55e; }
    .status-value.warning { color: #f59e0b; }
    .status-value.danger { color: #ef4444; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #22c55e, #06b6d4);
      color: #000;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.6);
    }
    .btn:hover { transform: translateY(-1px); }
    .section-title {
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .feature-list {
      list-style: none;
      margin-bottom: 16px;
    }
    .feature-list li {
      padding: 6px 0;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .feature-list li::before {
      content: '✅';
      font-size: 12px;
    }
    .footer {
      text-align: center;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .footer a {
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      text-decoration: none;
    }
    .footer a:hover { color: #22c55e; }
    .shield-icon {
      font-size: 64px;
      text-align: center;
      margin: 12px 0;
      filter: drop-shadow(0 0 20px rgba(34,197,94,0.3));
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🛡️</span>
    <h1>SweepGuard</h1>
  </div>

  <div class="shield-icon">🛡️</div>

  <div class="status-card">
    <div class="status-row">
      <span class="status-label">Status</span>
      <span class="status-value safe" id="status">● Active</span>
    </div>
    <div class="status-row">
      <span class="status-label">Drainer DB</span>
      <span class="status-value safe" id="drainer-count">Loading...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Phishing DB</span>
      <span class="status-value safe" id="phishing-count">Loading...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Current Site</span>
      <span class="status-value" id="current-site">—</span>
    </div>
    <div class="status-row">
      <span class="status-label">Site Risk</span>
      <span class="status-value safe" id="site-risk">Safe</span>
    </div>
  </div>

  <div class="section-title">Active Protection</div>
  <ul class="feature-list">
    <li>Drainer Detection</li>
    <li>Phishing Blocking</li>
    <li>Transaction Simulation</li>
    <li>Approval Monitoring</li>
  </ul>

  <button class="btn btn-primary" id="scan-btn">🔍 Scan Current Site</button>
  <button class="btn btn-secondary" id="dashboard-btn">📊 Open Dashboard</button>

  <div class="footer">
    <a href="https://sweeptsguard.vercel.app" target="_blank">sweeptsguard.vercel.app</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
